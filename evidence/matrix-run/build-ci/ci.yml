name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint (ruff) ────────────────────────────────────────────────────────────
  lint:
    name: Lint / ruff
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: pip-lint-${{ matrix.python-version }}-

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check . --output-format=github

  # ── Type check (mypy) ─────────────────────────────────────────────────────
  typecheck:
    name: Type check / mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: pip-typecheck-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          # Install the project itself so mypy can resolve imports
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Run mypy
        run: mypy .

  # ── Tests + coverage ──────────────────────────────────────────────────────
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: pip-test-${{ matrix.python-version }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage[toml]
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Build artifacts ───────────────────────────────────────────────────────
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-build-3.12-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: pip-build-3.12-

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python package
        run: python -m build

      - name: Build Node assets
        run: npm run build --if-present

      - name: Upload Python dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Node build output
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: |
            build/
            dist/
            .next/
            out/
          if-no-files-found: ignore
          retention-days: 7

  # ── Gate ──────────────────────────────────────────────────────────────────
  gate:
    name: Gate — all checks passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}"      != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.test.result }}"      != "success" ||
                "${{ needs.build.result }}"     != "success" ]]; then
            echo "One or more required jobs did not succeed."
            echo "lint:      ${{ needs.lint.result }}"
            echo "typecheck: ${{ needs.typecheck.result }}"
            echo "test:      ${{ needs.test.result }}"
            echo "build:     ${{ needs.build.result }}"
            exit 1
          fi
          echo "All checks passed."
